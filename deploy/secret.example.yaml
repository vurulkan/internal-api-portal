# Secrets read by the portal through files under /etc/portal-secrets (see
# deployment.yaml). Create it once, before or after the first deploy:
#
#   kubectl -n internal-api-portal create secret generic internal-api-portal-secrets \
#     --from-literal=data-encryption-key="$(openssl rand -base64 32)" \
#     --from-literal=bootstrap-admin-password="$(openssl rand -base64 18)"
#
# then restart the pod. Keep a copy of data-encryption-key somewhere safe: without
# it the stored LDAP bind password and Azure AD client secret can't be decrypted
# (they can be entered again in the admin UI).
#
# Rotating the key: move the current value to data-encryption-key-previous, put a
# new one in data-encryption-key, restart. The portal re-encrypts at startup; the
# previous key can be removed after that restart.
#
# This file is an example only and is not applied by kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: internal-api-portal-secrets
  namespace: internal-api-portal
type: Opaque
stringData:
  data-encryption-key: "<base64 of 32 random bytes: openssl rand -base64 32>"
  bootstrap-admin-password: "<initial admin password, changed at first sign-in>"
