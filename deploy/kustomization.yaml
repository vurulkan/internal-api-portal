# kubectl apply -k deploy/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: internal-api-portal
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
# Secrets: create "internal-api-portal-secrets" yourself (secret.example.yaml shows
# how); it is not part of these resources so a re-apply never overwrites it.
# Optional, review before adding to resources:
#   - networkpolicy.example.yaml   restrict traffic to the ingress controller
#   - ingress.example.yaml         TLS ingress
# "latest" with imagePullPolicy Always: a restart picks up the newest release
# (kubectl -n internal-api-portal rollout restart deployment/internal-api-portal).
# To pin a release instead, put its version here, e.g. "2.2.1".
images:
  - name: ghcr.io/vurulkan/internal-api-portal
    newTag: "latest"
