apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-api-portal
  namespace: internal-api-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-api-portal
  template:
    metadata:
      labels:
        app: internal-api-portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/vurulkan/internal-api-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_PATH
              value: /data/app.db
            - name: STATIC_DIR
              value: /app/public
            - name: TIMEZONE
              value: Europe/Istanbul
            - name: LOG_RETENTION_DAYS
              value: "30"
            - name: SESSION_MINUTES
              value: "60"
            - name: LOG_FORMAT
              value: json
            # Set to the ingress controller's pod CIDR so audit IPs and the login
            # lockout see the real client address, e.g. "10.244.0.0/16".
            - name: TRUSTED_PROXIES
              value: ""
          # Readiness checks the database; liveness only the process, so a slow
          # database never restarts the pod.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: internal-api-portal-data
