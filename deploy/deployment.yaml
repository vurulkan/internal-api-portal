apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-api-portal
  namespace: internal-api-portal
  labels:
    app: internal-api-portal
spec:
  # SQLite on a ReadWriteOnce volume: exactly one replica. Recreate stops the old pod
  # before the new one mounts the volume (a rolling update would hang on the RWO
  # attachment or run two writers).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: internal-api-portal
  template:
    metadata:
      labels:
        app: internal-api-portal
    spec:
      # The portal never calls the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # uid 100 / gid 101: the user of every image version, so volumes written by
        # older releases stay readable. fsGroup makes a fresh volume writable.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/vurulkan/internal-api-portal:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── Storage ───────────────────────────────────────────────────────
            - name: DATA_PATH
              value: /data/app.db
            # Nightly copy of the database to /data/backups (VACUUM INTO), 7 kept.
            - name: BACKUP_INTERVAL
              value: 24h
            - name: BACKUP_KEEP
              value: "7"
            # ── Behaviour ─────────────────────────────────────────────────────
            - name: TIMEZONE
              value: Europe/Istanbul
            - name: LOG_RETENTION_DAYS
              value: "30"
            - name: SESSION_MINUTES
              value: "60"
            - name: LOG_FORMAT
              value: json
            # ── Network ───────────────────────────────────────────────────────
            # The ingress controller's pod CIDR, so audit IPs and the login lockout
            # see the real client address, e.g. "10.244.0.0/16".
            - name: TRUSTED_PROXIES
              value: ""
            # Set to "true" once the portal is only reachable over HTTPS.
            - name: HSTS_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Startup allows ~60 s for migrations on a large database; liveness only
          # checks the process, readiness also the database, so a slow database takes
          # the pod out of the Service instead of restarting it.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Idle use is ~20 MiB; try-it responses (MAX_RESPONSE_BYTES) and large
          # specs are held in memory, so leave headroom.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only; SQLite and Go may need a temp dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: internal-api-portal-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
