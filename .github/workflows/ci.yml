name: CI

on:
  push:
    branches: [main]
    # Release tags use the repo's scheme without a "v": 1.3.0
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # The newest patch of the Go line the image is built with (Dockerfile:
      # golang:1.27-alpine), not the go.mod minimum: govulncheck then sees a patched
      # standard library, and tests run on the toolchain that ships.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      # staticcheck v0.8.1 vendors an x/tools whose importer can't read Go 1.27.2's
      # export data ("export data version 5"); build it against a newer x/tools until
      # a staticcheck release does.
      - name: staticcheck
        run: |
          tools="$(mktemp -d)"
          (cd "$tools" && go mod init sc >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0 \
            && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)
          "$RUNNER_TEMP/staticcheck" ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The bundle ships to browsers, so high / critical advisories in runtime
      # dependencies fail the build. (Known moderate ones: react-router 6, fixed only
      # in 7 — M6 rewrites routing; swagger-ui-react's markdown chain — M8.)
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: type check
        run: npx tsc --noEmit
      - name: build
        run: npm run build

  # Pull requests and main: build the image to prove the Dockerfile works.
  # Release tags (1.6.0): build linux/amd64 + linux/arm64 with an SBOM and SLSA
  # provenance, publish :X.Y.Z and :latest only, and sign the digest with cosign
  # (keyless, GitHub OIDC). GHCR has no OCI referrers API, so the signature is
  # stored as a sha256-<digest>.sig tag next to the image.
  #
  # Publishing also needs the repository variable PUBLISH_IMAGES=true, and the GHCR
  # package must grant this repository write access (package settings -> Manage
  # Actions access).
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_IMAGES == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Put org.opencontainers.image.* on the index too: GHCR reads the source
          # annotation there to link the package to this repository.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: sign
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
