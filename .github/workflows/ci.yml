name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # The newest patch of the Go line the image is built with (Dockerfile:
      # golang:1.27-alpine), not the go.mod minimum: govulncheck then sees a patched
      # standard library, and tests run on the toolchain that ships.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      # staticcheck v0.8.1 vendors an x/tools whose importer can't read Go 1.27.2's
      # export data ("export data version 5"); build it against a newer x/tools until
      # a staticcheck release does.
      - name: staticcheck
        run: |
          tools="$(mktemp -d)"
          (cd "$tools" && go mod init sc >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0 \
            && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)
          "$RUNNER_TEMP/staticcheck" ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: type check
        run: npx tsc --noEmit
      - name: build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only; publishing from CI (multi-arch, SBOM, signing) comes with M3.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
