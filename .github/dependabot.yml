version: 2
# Updates wait 14 days after a release (cooldown): a compromised or broken release is
# usually caught by then. The same rule applies to versions picked by hand.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the build toolchain and UI framework are planned work, not
      # drive-by bumps. Held back on purpose: React 19 (and React Router 8, which needs
      # it), TypeScript 7 and ESLint 10 (typescript-eslint / jsx-a11y don't support
      # them yet).
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types follow the Node line the image builds with (node:24-alpine).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  # Base image digests in the Dockerfile. Node majors are moved by hand from one
  # LTS to the next; odd (non-LTS) majors are skipped.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
